name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor android
        run: npx cap sync android

      - name: Make gradlew executable
        # actions/checkout 不保留可执行位，不加这步会报 Permission denied (exit 126)
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show version
        run: |
          VER=$(cat VERSION 2>/dev/null || echo "0.0.0")
          echo "VERSION=$VER" >> $GITHUB_ENV
          echo "版本 $VER · build $GITHUB_RUN_NUMBER"

      - name: Rename APK
        run: |
          mkdir -p output
          SRC=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "source: $SRC"
          cp "$SRC" "output/ShelfAudio-${{ env.VERSION }}.apk"
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShelfAudio-apk
          path: output/*.apk
          if-no-files-found: error
