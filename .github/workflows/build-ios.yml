name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # macos-15 = Xcode 16+；Capacitor 8 需要现代 SDK
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          # 选可用的最新 Xcode（macos-15 镜像通常有 16.x / 26.x）
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; else sudo xcode-select -s /Applications/Xcode.app/Contents/Developer; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS
        # Capacitor 8 用 Swift Package Manager（无 Podfile），cap sync 会生成 CapApp-SPM/Package.swift
        run: npx cap sync ios

      - name: Show SPM manifest
        run: cat ios/App/CapApp-SPM/Package.swift

      - name: Compute version
        id: ver
        run: |
          VER=$(cat VERSION 2>/dev/null | tr -d '[:space:]')
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VER="0.1.0"; fi
          echo "marketing=$VER" >> $GITHUB_OUTPUT
          echo "build=$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT
          echo "Version: $VER (build $GITHUB_RUN_NUMBER)"

      - name: Build unsigned app
        working-directory: ios/App
        run: |
          set -euo pipefail
          # 未签名构建：不指定 team / identity
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        working-directory: ios/App
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then echo "找不到 .app 产物"; find build/Build/Products -maxdepth 3 | head -40; exit 1; fi

          rm -rf Payload && mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH" .app)

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.ver.outputs.marketing }}" "Payload/$APP_NAME.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.ver.outputs.build }}" "Payload/$APP_NAME.app/Info.plist"
          echo "--- version in bundle ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "Payload/$APP_NAME.app/Info.plist"
          echo "--- UIBackgroundModes (后台播放必须含 audio) ---"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "Payload/$APP_NAME.app/Info.plist"

          zip -qr ShelfAudio-unsigned.ipa Payload
          mkdir -p ../../output
          mv ShelfAudio-unsigned.ipa ../../output/ShelfAudio-unsigned.ipa
          ls -lh ../../output

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShelfAudio-ipa
          path: output/*.ipa
          if-no-files-found: error
