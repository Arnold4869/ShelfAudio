name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------- Android ----------------
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: No emoji in UI (icons must be hand-drawn SVG)
        run: python3 scripts/check-emoji.py

      - name: Verify imports resolve
        run: node scripts/check-imports.mjs

      - name: Player track-mutex regression
        run: node scripts/test-player-mutex.mjs

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor android
        run: npx cap sync android

      - name: Make gradlew executable
        # actions/checkout 不保留可执行位，缺这步会 Permission denied (exit 126)
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package APK
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          mkdir -p output
          SRC=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$SRC" "output/ShelfAudio-${VER}.apk"
          ls -lh output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: output/*.apk
          if-no-files-found: error

  # ---------------- iOS ----------------
  ios:
    # macos-15 = Xcode 16+
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; else sudo xcode-select -s /Applications/Xcode.app/Contents/Developer; fi
          xcodebuild -version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: No emoji in UI (icons must be hand-drawn SVG)
        run: python3 scripts/check-emoji.py

      - name: Verify imports resolve
        run: node scripts/check-imports.mjs

      - name: Player track-mutex regression
        run: node scripts/test-player-mutex.mjs

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS
        # Capacitor 8 用 Swift Package Manager（无 Podfile）
        run: npx cap sync ios

      - name: Compute version
        id: ver
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "VERSION 文件不合法: '$VER'"; exit 1; fi
          echo "marketing=$VER" >> $GITHUB_OUTPUT
          echo "build=$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT

      - name: Build unsigned app
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        working-directory: ios/App
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP_PATH" ]; then echo "找不到 .app 产物"; find build/Build/Products -maxdepth 3 | head -40; exit 1; fi

          rm -rf Payload && mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH" .app)

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.ver.outputs.marketing }}" "Payload/$APP_NAME.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.ver.outputs.build }}" "Payload/$APP_NAME.app/Info.plist"
          echo "--- version ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "Payload/$APP_NAME.app/Info.plist"
          echo "--- UIBackgroundModes (后台播放必须含 audio) ---"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "Payload/$APP_NAME.app/Info.plist"

          zip -qr ShelfAudio-unsigned.ipa Payload
          mkdir -p ../../output
          mv ShelfAudio-unsigned.ipa ../../output/ShelfAudio-unsigned.ipa
          ls -lh ../../output

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: output/*.ipa
          if-no-files-found: error

  # ---------------- 发布 Release（两个平台都成功才发）----------------
  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "VERSION 文件不合法: '$VER'"; exit 1; fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -lh artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: 听书 ${{ steps.v.outputs.version }}
          body: |
            ## 听书 ${{ steps.v.outputs.version }}

            儿童友好的 Audiobookshelf 有声书播放器。

            ### 下载
            | 平台 | 文件 | 安装方式 |
            |---|---|---|
            | iOS | `ShelfAudio-unsigned.ipa` | 未签名，用 Sideloadly 侧载（免费 Apple ID 签名 7 天有效） |
            | Android | `ShelfAudio-${{ steps.v.outputs.version }}.apk` | 直接安装（需允许「未知来源」） |

            ### 首次使用
            1. 服务器地址填 `http://内网IP:端口`（NAS 所在 WiFi 下）
            2. 用户名 / 密码登录
            3. 到设置页设一个**家长密码**（防止孩子自己切到成人模式）

            ---
            *自动构建 · 提交 ${{ github.sha }}*
          files: |
            artifacts/**.ipa
            artifacts/**.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
