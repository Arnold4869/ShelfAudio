name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------- Android ----------------
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: No emoji in UI (icons must be hand-drawn SVG)
        run: python3 scripts/check-emoji.py

      - name: Android XML checks
        run: python3 scripts/check-xml.py

      - name: Verify imports resolve
        run: node scripts/check-imports.mjs

      - name: Listening-stats logic
        run: node scripts/test-stats.mjs

      - name: Player track-mutex regression
        run: node scripts/test-player-mutex.mjs

      - name: Update-check version compare
        run: node scripts/test-updater.mjs

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor android
        run: npx cap sync android

      - name: Stamp version into build.gradle
        # versionCode 必须随版本递增，否则 Android 覆盖安装时拒装（老板反馈的另一个隐患）
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          # 注意：绝不能留下前导 0（"%02d%02d" 会产出 00401，Groovy 把前导 0 当八进制字面量，值错甚至编译失败）
          CODE=$(printf '%s' "$VER" | awk -F. '{printf "%d", $1*10000 + $2*100 + $3}')
          python3 - "$CODE" "$VER" <<'PY'
          import re, sys, pathlib
          code, ver = sys.argv[1], sys.argv[2]
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          s = re.sub(r'versionCode \d+', f'versionCode {code}', s)
          s = re.sub(r'versionName "[^"]*"', f'versionName "{ver}"', s)
          p.write_text(s)
          print('stamped:', code, ver)
          PY
          grep -n 'versionCode\|versionName' android/app/build.gradle

      - name: Decode signing keystore
        # 固定签名的 keystore 存在 GitHub Secret（base64），解码到 android/app/ 供 build.gradle 使用。
        # 之前用 debug 签名，每个 runner 的 debug keystore 都不同 → 覆盖安装报「签名不一致」。
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "缺少 ANDROID_KEYSTORE_B64 secret"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/shelfaudio.keystore
          ls -l android/app/shelfaudio.keystore

      - name: Make gradlew executable
        # actions/checkout 不保留可执行位，缺这步会 Permission denied (exit 126)
        run: chmod +x android/gradlew

      - name: Build APK (fixed signature)
        working-directory: android
        env:
          SA_KEYSTORE_PATH: shelfaudio.keystore
          SA_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          SA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package APK
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          mkdir -p output
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$SRC" "output/ShelfAudio-${VER}.apk"
          ls -lh output

      - name: Verify APK signature (must be the fixed key)
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          # apksigner 在 Android SDK build-tools 里
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E 'Signer #1 certificate (DN|SHA-256)' | head -4

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: output/*.apk
          if-no-files-found: error

  # ---------------- iOS ----------------
  ios:
    # macos-15 = Xcode 16+
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; else sudo xcode-select -s /Applications/Xcode.app/Contents/Developer; fi
          xcodebuild -version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: No emoji in UI (icons must be hand-drawn SVG)
        run: python3 scripts/check-emoji.py

      - name: Android XML checks
        run: python3 scripts/check-xml.py

      - name: Verify imports resolve
        run: node scripts/check-imports.mjs

      - name: Listening-stats logic
        run: node scripts/test-stats.mjs

      - name: Player track-mutex regression
        run: node scripts/test-player-mutex.mjs

      - name: Update-check version compare
        run: node scripts/test-updater.mjs

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS
        # Capacitor 8 用 Swift Package Manager（无 Podfile）
        run: npx cap sync ios

      - name: Compute version
        id: ver
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "VERSION 文件不合法: '$VER'"; exit 1; fi
          echo "marketing=$VER" >> $GITHUB_OUTPUT
          echo "build=$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT

      - name: Build unsigned app
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        working-directory: ios/App
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP_PATH" ]; then echo "找不到 .app 产物"; find build/Build/Products -maxdepth 3 | head -40; exit 1; fi

          rm -rf Payload && mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH" .app)

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.ver.outputs.marketing }}" "Payload/$APP_NAME.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.ver.outputs.build }}" "Payload/$APP_NAME.app/Info.plist"
          echo "--- version ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "Payload/$APP_NAME.app/Info.plist"
          echo "--- UIBackgroundModes (后台播放必须含 audio) ---"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "Payload/$APP_NAME.app/Info.plist"

          zip -qr ShelfAudio-unsigned.ipa Payload
          mkdir -p ../../output
          mv ShelfAudio-unsigned.ipa ../../output/ShelfAudio-unsigned.ipa
          ls -lh ../../output

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: output/*.ipa
          if-no-files-found: error

  # ---------------- 发布 Release（两个平台都成功才发）----------------
  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "VERSION 文件不合法: '$VER'"; exit 1; fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -lh artifacts

      - name: Write update manifest
        # 简易更新清单：老板想把「指定位置」换成自己的服务器/NAS 时，
        # 把这个 update.json 放到那儿、App 里填地址即可（格式见 src/lib/updater.js）
        run: |
          VER=${{ steps.v.outputs.version }}
          cat > artifacts/update.json <<EOF
          {
            "version": "$VER",
            "apk": "https://github.com/${{ github.repository }}/releases/download/v$VER/ShelfAudio-$VER.apk",
            "ipa": "https://github.com/${{ github.repository }}/releases/download/v$VER/ShelfAudio-unsigned.ipa",
            "notes": "见 Release 说明"
          }
          EOF
          cat artifacts/update.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: 听书 ${{ steps.v.outputs.version }}
          body: |
            ## 听书 ${{ steps.v.outputs.version }}

            儿童友好的 Audiobookshelf 有声书播放器。

            ### 下载
            | 平台 | 文件 | 安装方式 |
            |---|---|---|
            | iOS | `ShelfAudio-unsigned.ipa` | 未签名，用 Sideloadly 侧载（免费 Apple ID 签名 7 天有效） |
            | Android | `ShelfAudio-${{ steps.v.outputs.version }}.apk` | 直接安装（需允许「未知来源」） |

            ### 首次使用
            1. 服务器地址填 `http://内网IP:端口`（NAS 所在 WiFi 下）；
               外网填反代地址 `https://你的反代域名:端口`
            2. 用户名 / 密码登录
            3. 到 设置 → 家长设置 里设一个**家长密码**（操控类设置都要它才能进）

            ### 升级
            - **Android**：从本版起已使用**固定签名**，可直接覆盖安装（不必卸载）。
              也可在 App 内「设置 → 关于 → 检测更新」一键检查。
            - **iOS**：未签名 ipa，每次升级都需用 Sideloadly 重新侧载（App 内不提供检测更新）。

            ---
            *自动构建 · 提交 ${{ github.sha }}*
          files: |
            artifacts/**.ipa
            artifacts/**.apk
            artifacts/update.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
